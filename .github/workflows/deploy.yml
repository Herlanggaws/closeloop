name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to GHCR (xervproject-cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (xervproject-cloud)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./project/backend
          push: true
          tags: |
            ghcr.io/xervproject-cloud/closeloop-backend:latest
            ghcr.io/xervproject-cloud/closeloop-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./project/frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.saidloop.com
          tags: |
            ghcr.io/xervproject-cloud/closeloop-frontend:latest
            ghcr.io/xervproject-cloud/closeloop-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Zero-Downtime Rollout on VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull images and perform zero-downtime rolling update on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/xerv/closeloop
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            git fetch origin main
            git checkout -f -B main origin/main
            git reset --hard origin/main

            # Ensure db, nginx, and certbot are running and pull new app images while old containers still serve traffic
            docker compose up -d db
            docker compose pull backend frontend

            rollout_service() {
              local svc="$1"
              local old_ids
              old_ids=$(docker compose ps -q "$svc" || true)

              if [ -z "$old_ids" ]; then
                docker compose up -d --no-deps "$svc"
              else
                echo "Scaling up new $svc container alongside existing instance..."
                docker compose up -d --no-deps --scale "$svc=2" --no-recreate "$svc"
              fi

              local new_id=""
              for id in $(docker compose ps -q "$svc"); do
                if ! echo "$old_ids" | grep -q "$id"; then
                  new_id="$id"
                  break
                fi
              done
              if [ -z "$new_id" ]; then
                new_id=$(docker compose ps -q "$svc" | head -n 1)
              fi

              echo "Waiting for new $svc container ($new_id) to become healthy..."
              local healthy=0
              for i in $(seq 1 45); do
                local status
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$new_id" 2>/dev/null || echo "starting")
                if [ "$status" = "healthy" ]; then
                  healthy=1
                  break
                fi
                sleep 2
              done

              if [ "$healthy" -ne 1 ]; then
                echo "New $svc container failed healthcheck; keeping old instance and aborting!" >&2
                docker logs --tail=50 "$new_id" || true
                if [ -n "$old_ids" ] && [ "$new_id" != "$old_ids" ]; then
                  docker rm -f "$new_id" || true
                fi
                return 1
              fi

              docker compose up -d --no-deps nginx certbot
              docker compose exec -T nginx nginx -s reload || true

              if [ -n "$old_ids" ]; then
                for old_id in $old_ids; do
                  if [ "$old_id" != "$new_id" ]; then
                    echo "Draining and stopping old $svc container ($old_id)..."
                    docker stop -t 15 "$old_id" || true
                    docker rm -f "$old_id" || true
                  fi
                done
                docker compose up -d --no-deps --scale "$svc=1" --no-recreate "$svc"
                docker compose exec -T nginx nginx -s reload || true
              fi
              echo "$svc rolled out with zero downtime!"
            }

            rollout_service backend
            rollout_service frontend

            docker image prune -f
            docker compose ps
