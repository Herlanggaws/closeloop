name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to GHCR (xervproject-cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (xervproject-cloud)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./project/backend
          push: true
          tags: |
            ghcr.io/xervproject-cloud/closeloop-backend:latest
            ghcr.io/xervproject-cloud/closeloop-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./project/frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.saidloop.com
          tags: |
            ghcr.io/xervproject-cloud/closeloop-frontend:latest
            ghcr.io/xervproject-cloud/closeloop-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Zero-Downtime Rollout on VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull images and perform zero-downtime rolling update on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            cd /home/xerv/closeloop
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            git fetch origin main
            git checkout -f -B main origin/main
            git reset --hard origin/main
            bash ./scripts/deploy-rollout.sh
