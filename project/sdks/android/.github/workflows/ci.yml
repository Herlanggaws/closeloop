# Runs in XERV-Project/saidloop-android (the release repo). Ignored inside the closeloop monorepo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, build and publish locally
        run: ./gradlew --no-daemon :sdk:testDebugUnitTest :sdk:assembleRelease :sample:assembleDebug :sdk:publishToMavenLocal
      - name: Check the published POM
        run: |
          pom=$(ls ~/.m2/repository/com/saidloop/android/*/android-*.pom)
          cat "$pom"
          grep -q "<artifactId>android</artifactId>" "$pom"
