// React Native autolinks this module. The app supplies the Android Gradle plugin and React Native.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "ai.closeloop.reactnative"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    defaultConfig {
        minSdkVersion Math.max(24, safeExtGet("minSdkVersion", 24))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
    // Native SDK: `./gradlew :sdk:publishToMavenLocal` in project/sdks/android until it is on Maven Central.
    mavenLocal()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.saidloop:android:0.1.0"
}
