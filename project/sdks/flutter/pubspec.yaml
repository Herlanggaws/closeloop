name: saidloop_flutter
description: "Saidloop for Flutter: shake to report, masked screenshots and an offline queue, backed by the native Android and iOS SDKs."
version: 0.1.0
homepage: https://github.com/XERV-Project/saidloop-flutter
repository: https://github.com/XERV-Project/saidloop-flutter
issue_tracker: https://github.com/XERV-Project/saidloop-flutter/issues
topics:
  - bug-report
  - feedback
  - screenshot
  - mcp

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.saidloop.flutter
        pluginClass: SaidloopFlutterPlugin
      ios:
        pluginClass: SaidloopFlutterPlugin
