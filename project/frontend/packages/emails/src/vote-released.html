<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>An idea you voted for just shipped</title>
  </head>
  <body style="margin:0;padding:0;background:#F5F5F5;">
    <!--
      Source of truth for outbound mail is the Go renderer:
      project/backend/internal/infrastructure/email/vote.go (RenderVoteReleasedHTML)
      Placeholders: {{project_name}} {{idea_title}} {{release_note}} {{votes_line}}
      {{board_host}} {{open_url}} {{initial}}
    -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5F5F5;padding:64px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:100%;background:#FFFFFF;border:1px solid #17171714;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:14px 24px;background:#FAFAFA;border-bottom:1px solid #17171714;">
                <p style="margin:0 0 4px;font-size:14px;line-height:1.4;color:#171717;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  An idea you voted for just shipped
                </p>
                <p style="margin:0;font-size:12px;line-height:1.4;color:#A3A3A3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  {{project_name}} via Saidloop
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 40px;">
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 20px;">
                  <tr>
                    <td style="width:28px;height:28px;background:#F59E0B;border-radius:8px;text-align:center;vertical-align:middle;font-size:15px;line-height:28px;color:#FFFFFF;font-weight:800;font-family:Nunito,system-ui,sans-serif;">
                      {{initial}}
                    </td>
                    <td style="padding-left:8px;font-size:17px;line-height:1.2;color:#3B2F2F;font-weight:800;font-family:Nunito,system-ui,sans-serif;">
                      {{project_name}}
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 20px;display:inline-block;padding:2px 8px;border:1px solid #1717171F;border-radius:999px;font-size:11px;line-height:18px;color:#171717;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  <span style="display:inline-block;width:6px;height:6px;background:#16A34A;border-radius:50%;margin-right:6px;vertical-align:middle;"></span>Released
                </p>
                <h1 style="margin:0 0 20px;font-size:26px;line-height:1.2;letter-spacing:-0.5px;color:#171717;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  {{idea_title}} is live
                </h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:24px;color:#737373;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  {{release_note}}
                </p>
                <div style="margin:0 0 20px;padding:12px;background:#F5F5F5;border-radius:10px;">
                  <p style="margin:0;font-size:13px;line-height:1.4;color:#737373;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                    ↑ {{votes_line}}
                  </p>
                </div>
                <p style="margin:0;">
                  <a href="{{open_url}}" style="display:inline-block;padding:12px 20px;background:#171717;color:#FFFFFF;text-decoration:none;border-radius:6px;font-size:14px;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;line-height:20px;">See what's new</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 40px;border-top:1px solid #17171714;">
                <p style="margin:0 0 6px;font-size:12px;line-height:18px;color:#A3A3A3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  You're getting this because you voted on {{board_host}}.
                </p>
                <p style="margin:0;font-size:12px;line-height:1.4;color:#A3A3A3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                  Sent with Saidloop
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
