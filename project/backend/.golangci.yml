version: "2"

linters:
  default: standard
  enable:
    - rowserrcheck
    - sqlclosecheck
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
    staticcheck:
      checks:
        - "*"
        - -ST1000
        - -ST1005
